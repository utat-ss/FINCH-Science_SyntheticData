cfg_export:
  entity: 'UTAT-Science'
  project: 'Testing Synthetic Data - 1D Cond-UNet'
  name: 'Validating Test Pipeline 2'
  local_log: 'test_logs.txt' # Path for the local loggging of alerts prints, etc
  
cfg_nearneigh:

  cfg_import:
    psi2_path: 'C:\SenkDosya\Projects\FINCH-Science_SyntheticData\training\diffusion\ExpAnalysis_002-0\psi2.csv' # The exact path for the psi_2/ksi_val+ksi_tests dataset, which is the dataset NOT used to train the synthesizer, only used in val/test
    spec_range: [400, 2490] # Spectral range, inclusive, will be used to synthesize the data, has to match the trained model specs
    separation_ratio: 0.5 # The exact separation ratio for the data to be synthesized and preserved, # of real = sep_ratio * len(dataset)

  # Specifics of synthesis
  cfg_synthesis:
    model_type: GaussianDiffusion # The main class representing model architecture/type e.g.: GaussianDiffusion (in the diffusion code)
    cfg_model_setup_path: 'C:\SenkDosya\Projects\FINCH-Science_SyntheticData\testing\diffusion\pipeline_test_2\cfg_diffusion_setup.json' # The path to the model dict, for diffusion this would be cfg_diffusion_setup.json outputted after diffusion training
    model_statedict_path: 'C:\SenkDosya\Projects\FINCH-Science_SyntheticData\training\diffusion\ExpAnalysis_002-0\diffusion_model.pth' # The path for the model's statedict
    norm_dict_path: 'C:\SenkDosya\Projects\FINCH-Science_SyntheticData\training\diffusion\ExpAnalysis_002-0\norm_dict.json' # The path for the norm dict used during training, needed for proper denormalization
    max_batch_size: 50 # The maximum batch size to be used during synthesis of points, usually safe to max out, any number more than the actual size defaults to the actual size, hard capped at 32
    device: 'cuda'

  # The omega, each element is a dict of args
  cfg_omega: 
    omega_1: 
      type: 'euc'
      method: 'min'
      spec_idx: [0,210]
      p: 2
    omega_2:
      type: 'sam'
      method: 'min'
      spec_idx: [0,210]
      p: 2
    omega_3:
      type: 'euc'
      method: 'max'
      spec_idx: [0,210]
      p: 2
    omega_4:
      type: 'sam'
      method: 'max'
      spec_idx: [0,210]
      p: 2
  
  cfg_export:
    metrics_save: 'C:\SenkDosya\Projects\FINCH-Science_SyntheticData\testing\diffusion\pipeline_test_2\metric_save.csv' # The save path for the metric results

  # Details on plotting the blobs, unused for now
  #cfg_blobs: ...
