cfg_synthesis:
  n_targets: 20 # The total amount of 'target_size's to be generated, i.e. final dataset shape: (n_targets * Batch, n_bands)
  norm_dict_path: ... # The path (...json) that has the dict storing how normalization was conducted
  architecture: ... # The main class representing model architecture e.g.: GaussianDiffusion (in the diffusion code)
  cfg_model_setup_path: ... # The path to the model dict, for diffusion this would be cfg_diffusion_setup.json outputted after diffusion training
  model_statedict_path: ... # The path for the model's statedict
  device: 'cuda' # The preferred device to conduct data synthesis on

  cfg_absampler_setup:
    absampler_type: 'DirAbSamp'
    cfg_absampler: # We do not include device here, it will be passed in at the config functions
      target_shape: [40,210] # Format is: [Batch, n_bands]

cfg_export:
  entity: 'UTAT-Science' # The team entity name
  project: 'Conditional U-Net Synthetic Data Generation' # Project name
  name: 'CondUNet_v0.1 Synthesis Run' # Run name
  master_path: ... # Master save path of the folder we are running everything in (must end with '\')
  ksi_train_path: ... # This is the rest of the path that will be used to save the generated CSV
  locallog_save: ... # Save path of the local log
  naming_base: 'CUNet_v01_' # Some base naming convention that'll be used to name all the spectra
  spectral_range: [400, 2490] # The spectral range of the data to be synthesized, used for CSV header generation
  



