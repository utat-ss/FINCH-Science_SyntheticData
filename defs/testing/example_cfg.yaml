cfg_export:

  project: 'Testing Synthetic Data - 1D Cond-UNet'
  name: '1st Test Run'
  local_log: 'test_logs.txt' # Path for the local loggging of alerts prints, etc
  

cfg_unmix:

  cfg_import:
    ksi_train_path: ... # The exact path of the .csv for the generated dataset, that will be used to train the critic
    psi2_path: ... # The exact path for the psi_2/ksi_val+ksi_tests dataset, which is the dataset NOT used to train the synthesizer, only used in val/test
    spec_range: [400, 2490] # Spectral range, inclusive

  cfg_loader:
    n_val: 200 # Number of val datapoints in ksi_val
    n_test: 123 # Number of test datapoints in ksi_val
    n_train_batch: 1 # Size of training batches in ksi_train
    num_workers: 4 # Number of workers in train loader
    prefetch_factor: 12 # How many batches each worker will prefetch
    seed: 3169 # Seed to seperate val and test in ksi_val

  cfg_train:  
    n_epoch: 100 # Total number of epochs
    n_tb_epoch: 150 # Total number of training batches per epoch
    device: 'gpu' # Device used
    dtype: 'float32' # Dtype used
    verbose: True # If want to output all the losses
    use_autocast: False # If want to use autocast (float16) to speed up calcs

  cfg_export:
    model_save: 'cond_unet.pth' # The save path for the model (critic) that was trained, can have .pth, adds it automatically
    test_save: 'preds.parquet' # Save path for the predictions on test data
    
  cfg_critic_setup:
    critic_type: 'MLP' # The type of critic to be trained
    cfg_critic: # Specific configs of the critic
      ... 

  cfg_optim_setup:
    loss_type: 'MSE' # The name of loss function to train critic
    cfg_loss: # Configs to initialize the loss function
      ...
    cfg_optim_type: 'AdamW'
    cfg_optim:
      lr: 1e-3
      weight_decay: 1e-2
      cfg_lrscheduler_setup: # If this is not given, lr scheduler will default to None
        lrscheduler_type: 'CosineAnealingLR'
        cfg_lrscheduler:
          ...


cfg_nearneigh:

  # The model that'll be used to synthesize data_synth from (psi_2 or ksi_val)/2
  cfg_model:
    architecture: ... # The main class representing model architecture e.g.: GaussianDiffusion (in the diffusion code)
    cfg_model_setup_path: ... # The path to the model dict, for diffusion this would be cfg_diffusion_setup.json outputted after diffusion training
    model_statedict_path: ... # The path for the model's statedict
  
  # The omega list, each element is a list of [distance_type, method, optional_parameter for euclidian], max doesn't make sense for now
  cfg_omega: [[type, method, optional(p)], ['euc', 'min', 2], ['sam', 'min'], ['euc', 'max', 5], ['sam', 'max']] 
  
  # Details on plotting the blobs, unused for now
  cfg_blobs: ...
