        modelinits_save: vccae_model_inits.json
        name: train_001
        norm_save: norm_dict.json
        project: VCCAE Synthetic Data Generation
        save_to_wandb: true
        test_save: generated_test_samples.parquet
cfg_loss_setup:
    value:
        loss_type: LossKLSAM
cfg_optim_setup:
    value:
        cfg_optim:
            cfg_lrscheduler_setup:
                cfg_lrscheduler: '...'
                lrscheduler_type: CosineAnealingLR
            lr: 1e-05
            weight_decay: 0.01
        optim_type: Adam
cfg_scheduler_setup:
    value:
        cfg_scheduler:
            exp: 2
            offset: 0.008
            steps: 3000
        scheduler_type: CosSchedule
cfg_train:
    value:
        device: cpu
        dtype: torch.float32
        n_epoch: 75
        n_tb_epoch: 150
