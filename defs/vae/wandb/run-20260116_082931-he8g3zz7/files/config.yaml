                - 1
                - 256
                - 256
                - 256
                - 256
            mlp_layers:
                - 256
                - 256
                - 256
                - 256
            num_spectra: 210
            out_layer: 64
cfg_data:
    value:
        cfg_dataset_save:
            psi1_path: defs/vae/psi_1
            psi2_path: defs/vae/psi_2
        cfg_import:
            data_handle: /data/simpler_data_rwc.csv
            spec_range:
                - 400
                - 2490
        cfg_loader:
            n_test: 1
            n_train_batch: 1
            n_val: 1
            seed: 1001
        cfg_normalize:
            norm_type: none
        cfg_split:
            batch_size: 1
            split_ratio: 0.8
cfg_export:
