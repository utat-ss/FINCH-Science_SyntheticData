cfg_export:
  entity: 'UTAT-Science' # The team entity name
  project: 'Data Synthesis' # Project name
  name: 'ISPRS 26 - TCVAE' # Run name
  # master_path: 'C:\SenkDosya\Projects\FINCH-Science_SyntheticData\synthesis\isprs\diffusion' # Master save path of the folder we are running everything in (must end with '\')
  master_path: 'synthesis/isprs/tcvae/' # Master save path of the folder we are running everything in (must end with '\')
  ksi_train_path: 'generated_tcvae.csv' # This is the rest of the path that will be used to save the generated CSV
  locallog_save:  'logs.txt' # Save path of the local log
  naming_base: 'TCVAE' # Some base naming convention that'll be used to name all the spectra
  spectral_range: [400, 2490] # The spectral range of the data to be synthesized, used for CSV header generation

